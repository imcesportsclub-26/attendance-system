<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b14"><title>IMC · Super Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><main class="admin-shell"><section class="card admin-card">
<div class="admin-header"><div class="brand-row compact"><div class="logo-badge"><span>IMC</span><small>GG</small></div><div><p class="eyebrow">IMC ESPORTS CLUB</p><h1>Super Admin Dashboard</h1><p class="subtitle no-bottom">Events & Attendance</p></div></div><div class="admin-actions"><button id="refreshButton" class="secondary-btn">Refresh</button><button id="logoutButton" class="danger-btn">Log Out</button></div></div>
<div class="event-admin-grid"><section class="admin-section"><p class="eyebrow">CREATE EVENT</p><h2>New Attendance Event</h2><form id="eventForm" class="event-form"><label><span>Event Name</span><input id="newEventName" required maxlength="120" placeholder="e.g. Weekly MLBB Scrim"></label><label><span>Event Type</span><select id="newEventType"><option>MLBB Scrim</option><option>PUBG Scrim</option><option>Meeting</option><option>Training</option><option>Other</option></select></label><label><span>Date</span><input id="newEventDate" type="date" required></label><label><span>Check-in Opens</span><input id="newOpensAt" type="datetime-local"></label><label><span>Check-in Closes</span><input id="newClosesAt" type="datetime-local"></label><label class="check-label"><input id="newRequireTeam" type="checkbox" checked><span>Require Team Name</span></label><label class="wide"><span>Note (Optional)</span><input id="newNote" maxlength="300" placeholder="e.g. Weekly practice scrim"></label><button class="primary-btn small wide" type="submit">Create Event & QR</button></form></section>
<aside class="qr-panel"><p class="eyebrow">SELECTED EVENT</p><select id="eventSelect" class="full-select"></select><div id="eventStatus" class="event-status"></div><div id="qrCode" class="qr-box"></div><p id="qrUrl" class="qr-url"></p><div class="stack-actions"><button id="downloadQrButton" class="secondary-btn full">Download QR PNG</button><button id="toggleEventButton" class="secondary-btn full">Close Check-In</button></div></aside></div>
<div id="adminMessage" class="message" role="status" aria-live="polite"></div><div class="stats-row"><div class="stat"><span id="eventCount">0</span><small>Events</small></div><div class="stat"><span id="totalCount">0</span><small>Selected attendance</small></div></div>
<div class="filters"><input id="searchInput" type="search" placeholder="Search name, intake or team…"><button id="exportButton" class="primary-btn small">Export Selected Event CSV</button></div><div class="table-wrap"><table><thead><tr><th>#</th><th>Student</th><th>Batch / Intake</th><th>Team</th><th>Check-in Time</th></tr></thead><tbody id="attendanceBody"></tbody></table></div>
</section></main><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script type="module" src="admin.js"></script></body></html>
