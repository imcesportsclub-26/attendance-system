<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#080b14" />
  <title>IMC Super Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page-shell">
    <section class="card login-card">
      <div class="brand-row">
        <div class="logo-badge"><span>IMC</span><small>GG</small></div>
        <div><p class="eyebrow">IMC ESPORTS CLUB</p><h1>Super Admin Login</h1></div>
      </div>
      <p class="subtitle">Only the authorized Super Admin account can access attendance logs.</p>
      <form id="loginForm" class="form-grid">
        <label><span>Email</span><input id="email" type="email" autocomplete="email" placeholder="admin@example.com" required /></label>
        <label><span>Password</span><input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required minlength="6" /></label>
        <button id="loginButton" class="primary-btn" type="submit"><span class="btn-text">Sign In</span><span class="btn-loader"></span></button>
      </form>
      <div id="loginMessage" class="message" role="status" aria-live="polite"></div>
      <a class="text-link" href="./">← Back to Check-In</a>
    </section>
  </main>
  <script type="module" src="login.js"></script>
</body>
</html>
