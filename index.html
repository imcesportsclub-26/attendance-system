<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b14"><title>IMC Attendance</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body>
<main class="page-shell"><section class="card checkin-card"><div class="brand-row"><div class="logo-badge"><span>IMC</span><small>GG</small></div><div><p class="eyebrow">IMC ESPORTS CLUB</p><h1>Attendance Check-In</h1></div></div>
<div id="eventPanel" class="event-summary"><div class="event-pill"><span class="live-dot"></span><span id="eventName">Loading event…</span></div><p id="eventMeta" class="subtitle"></p><p id="eventNote" class="privacy-note"></p></div>
<form id="checkinForm" class="form-grid" hidden><label><span>Student Name</span><input id="studentName" type="text" autocomplete="name" placeholder="e.g. Aung Aung" required maxlength="80"></label><label><span>Batch / Intake</span><input id="batchIntake" type="text" placeholder="e.g. Intake 2026 / Batch 9" required maxlength="60"></label><label id="teamField"><span>Team Name <small id="teamOptional"></small></span><input id="teamName" type="text" placeholder="e.g. Team Phoenix" maxlength="80"></label><button id="checkinButton" class="primary-btn" type="submit"><span class="btn-text">Check In</span><span class="btn-loader"></span></button></form>
<div id="message" class="message" role="status" aria-live="polite"></div><p class="privacy-note">Your attendance details are visible only to the IMC Super Admin.</p></section></main><script type="module" src="app.js"></script></body></html>
